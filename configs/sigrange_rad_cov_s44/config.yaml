# P6-D28 / sigma-range retrain. The fix P6-D7 and P6-D17 jointly point at.
#
# P6-D7 measured real WASP-39b sigma at 2.16e-3 normalised, which is 23-139x
# BELOW sigma_min=0.05. Real data does not sit at the edge of the trained noise
# distribution, it sits entirely outside it, so the sigma and covariance
# embeddings are asked at inference to read an error bar smaller than any they
# were trained on. P6-D8 Finding 2 showed moving Tier 1 -> Tier 0 recovers about
# two thirds of the coverage excess, so the scale gap is a dominant driver with a
# predicted effect size rather than a caveat.
#
# THIS ARM lowers sigma_min to 1e-3, which places real sigma INSIDE the range
# rather than at its edge, and switches to LOG-uniform sampling. The log draw is
# not cosmetic: uniform over [2e-3, 0.3] puts only 2.5% of samples below 0.01
# (median 0.150), so the model would still almost never see the real regime and
# the retrain would fail for a reason unrelated to the hypothesis. Log-uniform
# over [1e-3, 0.3] puts 40.5% below 0.01 (median 0.017), and 13.5% below the real
# 2.16e-3 against 0.4% under the uniform law. Measured over 40,000 draws.
#
# PREDICTION, WRITTEN BEFORE THE RUN as P6-D8 requires. On real WASP-39b the
# covariance arm's JS to the NS anchor falls from 0.426 toward the no-conditioning
# 0.344, and the +0.083 paradox shrinks by at least half. If it does NOT shrink,
# then P6-D26 is reinforced from a second direction, since A3 already showed the
# paradox is not caused by the inference-time Sigma-hat, and this would show it is
# not caused by the training sigma range either.
#
# NOTE ON HARDWARE. device is cuda deliberately. P6-D1 found MPS UNDER-TRAINS
# these models (ABC best val 1.923 on MPS against 1.390 on CUDA at the same seed
# and config), which is the artifact the whole H9 study exists to remove. Do not
# run this on MPS; the result would be uninterpretable.


dataset:
  file_path: "data/abc_rad/abc_rad_train.hdf"   # P3-D11 radius model (θ=[rp_rj,T,5×logX], WASP-39b geometry)
  n_train_samples: 28000   # n_train + n_valid MUST equal the train-file row count (32000):
  n_valid_samples: 4000    # fm4ar random_split's the file into train/valid internally
  random_seed: 44

theta_scaler:
  method: "MeanStdScaler"
  kwargs:
    dataset: "abc_rad"   # stats in mirage/register.py; radius freed = the P3-D11 fix

model:
  model_type: "fmpe"
  random_seed: 44
  t_theta_with_glu: True
  context_with_glu: False
  sigma_min: 0.0001
  time_prior_exponent: 2.0

  context_embedding_net:
    - block_type: "SoftClipFlux"     # tame residual standardised outliers (Vasist 2023)
      kwargs:
        bound: 15.0
    - block_type: "SpectraEncoder"
      kwargs:
        d_model: 128
        nhead: 4
        num_layers: 4
        dim_feedforward: 512
        dropout: 0.1
        output_dim: 256
        wlen_min: 0.55
        wlen_max: 7.30
        n_instruments: 4
        use_error_bars: True   # WI-1
        use_covariance: True   # WI-3: residual-covariance embedding of OOT frames
        n_bins: 52
        cov_embed_dim: 64
        cov_method: "flatten"  # ABC P=52; switch to "eigen" (CPU/CUDA) for JWST scale
        cov_whiten: True       # P3-D1: condition on correlation STRUCTURE, not scale
                               # (per-λ σ carries amplitude) → real visits ~10× the
                               # training σ stay in-distribution. Requires retrain.

  t_theta_embedding_net:
    - block_type: "PositionalEncoding"
      kwargs:
        n_freqs: 5
        encode_theta: False
    - block_type: "DenseResidualNet"
      kwargs:
        hidden_dims: [64, 32]
        activation: "GELU"
        output_dim: 32
        dropout: 0.0
        use_batch_norm: False

  vectorfield_net:
    network_type: "DenseResidualNet"
    kwargs:
      hidden_dims: [64, 32]
      activation: "GELU"
      dropout: 0.3
      use_batch_norm: True

training:

  stage_0:
    backup_interval: 1
    batch_size: 512
    n_workers: 0
    data_transforms:
      - type: "InjectCorrelatedNoise"
        kwargs:
          n_oot_frames: 100   # full OOT stack, matching the h9 arms exactly
          config:
            type: "CorrelatedNoiseGenerator"
            kwargs:
              sigma_min: 0.001   # P6-D7: real sigma 2.16e-3 now INSIDE the range
              sigma_log: true    # log-uniform, else 97.5% of draws miss the real regime
              sigma_max: 0.3    # stronger noise → larger logdens gap; lowering σ shrank it (0.02–0.12 → 0.22 nats)
              se_length_min: 0.02   # P3-D1: extended DOWN from 0.10 — real JWST corr is short-range
              se_length_max: 1.00   # (real PRISM nn-corr ~0.37 at 52 bins ⇒ se~0.02–0.05 µm); keep long tail
              ou_length_min: 0.05   # extended DOWN from 0.50 so the envelope brackets the real structure
              ou_length_max: 3.00
              random_seed: 44
    early_stopping:
      stage_patience: 50
    epochs: 512
    float32_matmul_precision: "high"
    gradient_clipping:
      enabled: True
      max_norm: 1.0
    logprob_evaluation:
      interval: null
      n_samples: 256
      ode_solver:
        method: "dopri5"
        tolerance: 1.0e-3
    optimizer:
      type: "AdamW"
      kwargs:
        lr: 3.0e-4
    scheduler:
      type: "ReduceLROnPlateau"
      kwargs:
        factor: 0.5
        patience: 10
        min_lr: 5.0e-8
    use_amp: False

local:
  device: "cuda"   # CUDA ONLY. The covariance branch (batched-cov matmul + fancy
                  # indexing) is unstable on MPS (command-buffer failures → loss
                  # 0.000), and P6-D1 showed MPS UNDER-TRAINS these models, which
                  # is the artifact the whole H9 study exists to remove.
                  #
                  # max_runtime is in SECONDS and fm4ar saves model__latest.pt on
                  # MAX_RUNTIME_EXCEEDED, which train_local.py then resumes from.
                  # On a capped-session machine (Kaggle, 12 h) set max_runtime
                  # BELOW the cap so the run checkpoints cleanly and the next
                  # session continues instead of restarting.
                  #
                  # Do NOT raise stage_0.n_workers to use spare cores. With
                  # n_workers: 0 the noise transform draws from the generator in
                  # the main process; workers each get their own RNG copy, which
                  # changes the injected noise and breaks comparability with the
                  # h9 arms this is measured against.
  max_runtime: 86400
  htcondor:
    bid: 50
    n_cpus: 8
    n_gpus: 1
    memory_cpus: 64000
    gpu_type: "H100"
